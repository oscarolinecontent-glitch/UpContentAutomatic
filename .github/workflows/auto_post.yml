name: HiFriendz Auto Post

on:
  schedule:
    # Đăng bài lúc 7h sáng (UTC+7 = 0h UTC)
    - cron: '0 0 * * *'
    # Đăng bài lúc 12h trưa (UTC+7 = 5h UTC)  
    - cron: '0 5 * * *'
    # Đăng bài lúc 19h tối (UTC+7 = 12h UTC)
    - cron: '0 12 * * *'
    # Báo cáo tổng kết lúc 21h30 (UTC+7 = 14h30 UTC)
    - cron: '30 14 * * *'
  
  # Cho phép chạy thủ công từ GitHub Actions UI
  workflow_dispatch:
    inputs:
      action:
        description: 'Lệnh cần chạy'
        required: true
        default: 'post'
        type: choice
        options:
          - post
          - scrape
          - monitor
          - report
          - test_ai

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Create data directory
        run: mkdir -p data

      - name: Write Facebook cookies from secret
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          printf '%s' "$FB_COOKIES" > data/fb_cookies.json

      - name: Determine action
        id: action
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then
            ACTION="${{ inputs.action }}"
          fi
          if [ -z "$ACTION" ]; then
            if [ "${{ github.event.schedule }}" = "30 14 * * *" ]; then
              ACTION="report"
            else
              ACTION="post"
            fi
          fi
          echo "Selected action: $ACTION"
          echo "cmd=$ACTION" >> $GITHUB_OUTPUT

      - name: Scrape rooms first (if posting)
        if: steps.action.outputs.cmd == 'post'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py scrape

      - name: Run action
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_COOKIES_PATH: ./data/fb_cookies.json
          MAX_POSTS_PER_DAY: '10'
          POST_DELAY_MIN: '300'
          POST_DELAY_MAX: '900'
        run: python main.py ${{ steps.action.outputs.cmd }}

      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-log-${{ github.run_number }}
          path: data/
          retention-days: 7
