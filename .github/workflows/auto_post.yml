name: HiFriendz Auto Post

on:
  schedule:
    # 7h sáng VN (0h UTC)
    - cron: '0 0 * * *'
    # 12h trưa VN (5h UTC)
    - cron: '0 5 * * *'
    # 19h tối VN (12h UTC)
    - cron: '0 12 * * *'
    # 21h30 tối VN (14h30 UTC) - Báo cáo tổng kết
    - cron: '30 14 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Lệnh cần chạy'
        required: true
        default: 'post'
        type: choice
        options:
          - post
          - scrape
          - monitor
          - report
          - test_ai

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Create data directory
        run: mkdir -p data

      - name: Write Facebook cookies from secret
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          printf '%s' "$FB_COOKIES" > data/fb_cookies.json

      - name: Run Action
        env:
          INPUT_ACTION: ${{ github.event.inputs.action }}
          SCHEDULE: ${{ github.event.schedule }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_COOKIES_PATH: ./data/fb_cookies.json
          MAX_POSTS_PER_DAY: '12'
          POST_DELAY_MIN: '300'
          POST_DELAY_MAX: '600'
        run: |
          if [ -n "$INPUT_ACTION" ]; then
            CMD="$INPUT_ACTION"
          elif [ "$SCHEDULE" = "30 14 * * *" ]; then
            CMD="report"
          else
            CMD="post"
          fi
          CMD=$(echo "$CMD" | tr -d '\r\n')
          echo "=========================================="
          echo "🚀 ĐANG CHẠY LỆNH: python main.py $CMD"
          echo "=========================================="
          
          if [ "$CMD" = "post" ]; then
            python main.py scrape
          fi
          
          python main.py "$CMD"

      - name: Upload activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-log-${{ github.run_number }}
          path: data/
          retention-days: 7
